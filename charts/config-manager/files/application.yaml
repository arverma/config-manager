# Default application config for the chart. Deployment repo can override per environment.

api:
  server:
    readHeaderTimeoutSeconds: 5
    readTimeoutSeconds: 30
    writeTimeoutSeconds: 30
    idleTimeoutSeconds: 60
    shutdownTimeoutSeconds: 10
  request:
    requestTimeoutSeconds: 30
  readyz:
    pingTimeoutSeconds: 2
  databaseRetry:
    maxAttempts: 5
    retryBackoffSeconds: 2

auth:
  enabled: {{ .Values.auth.enabled }}
  allowedEmailDomains:
{{- range .Values.auth.allowedEmailDomains }}
    - {{ . | quote }}
{{- end }}
  google:
    redirectUrl: {{ include "config-manager.authRedirectUrl" . | quote }}
    homeDomain: {{ .Values.auth.google.homeDomain | default "" | quote }}
  session:
    cookieName: cm_session
    cookieSecure: {{ if hasKey .Values.auth.session "cookieSecure" }}{{ .Values.auth.session.cookieSecure }}{{ else }}{{ .Values.ingress.tls.enabled }}{{ end }}
    idleTimeoutMinutes: {{ .Values.auth.session.idleTimeoutMinutes | default 480 }}
    absoluteTimeoutHours: {{ .Values.auth.session.absoluteTimeoutHours | default 24 }}
  apiKeys:
    bootstrapFromEnv: true

cache:
  enabled: {{ .Values.cache.enabled }}
  redis:
    host: {{ .Values.cache.redis.host | default "" | quote }}
    port: {{ .Values.cache.redis.port | default 6379 }}
    keyPrefix: {{ .Values.cache.redis.keyPrefix | default "cm:" | quote }}
  config:
    ttlSeconds: {{ .Values.cache.config.ttlSeconds | default 3600 }}
